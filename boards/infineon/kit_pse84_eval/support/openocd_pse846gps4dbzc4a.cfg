# The PSE846GPS4DBZC4A (EPC4) device uses the pse84xgxs4 OpenOCD target instead
# of the EPC2 pse84xgxs2 target. Override the target and delegate to the common
# board configuration.
set IFX_PSE84_TARGET_CFG target/infineon/pse84xgxs4.cfg
source [find openocd.cfg]

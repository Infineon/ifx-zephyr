# Set VTOR to app vector table before jumping (required for chain-load)
CONFIG_BOOT_INTR_VEC_RELOC=y

# SWAP upgrade mode.
CONFIG_BOOT_SWAP_USING_MOVE=y

# BOOT_MAX_ALIGN must match the slot write-block-size (16). It otherwise
# defaults from the chosen zephyr,flash node (RRAM, also 16), but pin it
# explicitly so the trailer geometry stays consistent with the slots.
CONFIG_MCUBOOT_BOOT_MAX_ALIGN=16

# No image signature verification by default.
CONFIG_BOOT_SIGNATURE_TYPE_NONE=y

# Image 0 (tfm_merged.hex) has no MCUboot TLV; disable primary-slot check.
CONFIG_BOOT_VALIDATE_SLOT0=n

# Must be large enough to cover the slot size divided by the flash
# erase-block size. 256 covers the default slots with 64 KB erase blocks.
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=256

# QSPI XIP reset vector is memory-mapped, not a flash offset; skip the check.
CONFIG_MCUBOOT_VERIFY_IMG_ADDRESS=n

# SPE (image 0) / NSPE (image 1) / CM55 (image 2).
CONFIG_UPDATEABLE_IMAGE_NUMBER=3

# Serial recovery over SCB2 (KitProg3/uart2), GPIO entrance via SW_1.
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=y
CONFIG_BOOT_SERIAL_DETECT_DELAY=100
CONFIG_BOOT_LINE_BUFS=16
CONFIG_BOOT_SERIAL_MAX_RECEIVE_SIZE=2048
# Must equal the QSPI write-block size to avoid corrupting uploaded images.
CONFIG_BOOT_SERIAL_UNALIGNED_BUFFER_SIZE=256

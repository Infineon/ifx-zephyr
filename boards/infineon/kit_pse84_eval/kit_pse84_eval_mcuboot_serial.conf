# MCUboot serial recovery for kit_pse84_eval. Apply on top of the MCUboot
# board configuration together with kit_pse84_eval_mcuboot_serial.overlay:
#   -DEXTRA_CONF_FILE=.../kit_pse84_eval_mcuboot_serial.conf
#   -DEXTRA_DTC_OVERLAY_FILE=.../kit_pse84_eval_mcuboot_serial.overlay

# SPE (image 0) / NSPE (image 1) / CM55 (image 2).
CONFIG_UPDATEABLE_IMAGE_NUMBER=3

# Serial recovery over SCB2 (KitProg3 VCOM), GPIO entrance via SW_1.
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=y
CONFIG_BOOT_SERIAL_DETECT_DELAY=100
CONFIG_BOOT_LINE_BUFS=16
CONFIG_BOOT_SERIAL_MAX_RECEIVE_SIZE=2048
# Must equal the QSPI page size to avoid corrupting uploaded images.
CONFIG_BOOT_SERIAL_UNALIGNED_BUFFER_SIZE=256

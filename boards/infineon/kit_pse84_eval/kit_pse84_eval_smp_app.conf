# Enlarge the UART mcumgr buffers so large SMP frames (image upload
# chunks) are not dropped as "Line too long". The default RX buffer of
# 128 bytes is too small for practical DFU upload throughput.
CONFIG_UART_MCUMGR_RX_BUF_SIZE=2048
CONFIG_MCUMGR_TRANSPORT_UART_MTU=2048
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2048
